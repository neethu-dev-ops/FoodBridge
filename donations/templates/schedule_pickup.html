
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Pickup - FoodBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Schedule Food Pickup</h4>
        </div>

        <div class="card-body p-4">
            <h5>{{ donation_request.donation.food_name }}</h5>
            <p class="text-muted">
                NGO: {{ donation_request.ngo.username }}
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Pickup Date and Time</label>
                    <input type="datetime-local"
                           name="pickup_date"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Pickup Location</label>
                    <input type="text"
                           name="pickup_location"
                           class="form-control"
                           placeholder="Enter pickup location"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Additional Notes</label>
                    <textarea name="notes"
                              class="form-control"
                              rows="3"
                              placeholder="Any additional instructions"></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Schedule Pickup
                </button>

                <a href="{% url 'donor_requests' %}"
                   class="btn btn-outline-secondary w-100 mt-2">
                    Back
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
