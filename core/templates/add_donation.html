
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Donation - FoodBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f8f2;
            color: #344536;
        }

        .navbar {
            background-color: #174d36;
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 23px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            color: #174d36;
            font-weight: 700;
        }

        .donation-card {
            max-width: 700px;
            margin: auto;
            border: none;
            border-radius: 18px;
            padding: 35px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #344536;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d5dfd5;
            border-radius: 8px;
            background: #fff;
            outline: none;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #247447;
            box-shadow: 0 0 0 3px rgba(36, 116, 71, 0.12);
        }

        form textarea {
            min-height: 100px;
        }

        .helptext {
            display: block;
            color: #7b887d;
            font-size: 12px;
            margin-top: 5px;
        }

        .errorlist {
            color: #dc3545;
            font-size: 13px;
            padding-left: 20px;
        }

        .btn-submit {
            background-color: #247447;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 13px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background-color: #174d36;
            color: white;
        }

        .back-link {
            color: #247447;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #174d36;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }

        @media (max-width: 576px) {
            .donation-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌱 FoodBridge</a>

        <a href="{% url 'donor_dashboard' %}"
           class="text-white text-decoration-none">
            Dashboard
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="page-header">
        <h2>Share Food, Share Hope 💚</h2>
        <p class="text-muted">
            Add your surplus food and help someone in need.
        </p>
    </div>

    <div class="card donation-card shadow-sm">

        <h4 class="text-success text-center mb-4">
            Add Food Donation
        </h4>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}
            {{ form.as_p }}

            <button type="button" id="suggest-category" class="btn btn-outline-primary mb-3">
               🤖 Suggest Food Category
            </button>

            <p id="category-message" class="small text-muted"></p>

            <button type="button" id="generate-description" class="btn btn-outline-success mb-3">
               ✨ Generate Description with AI
            </button>

<p id="ai-message" class="small text-muted"></p>

            <button type="submit" class="btn btn-submit w-100 mt-3">
                Submit Donation
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'donor_dashboard' %}" class="back-link">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</div>

<footer>
    <p class="mb-0">© 2026 FoodBridge | Share Food, Share Hope 🌱</p>
</footer>

<script>
document.getElementById('generate-description').addEventListener('click', async function () {

    const foodName = document.getElementById('id_food_name').value.trim();
    const quantity = document.getElementById('id_quantity').value.trim();
    const location = document.getElementById('id_location').value.trim();
    const descriptionField = document.getElementById('id_description');
    const message = document.getElementById('ai-message');

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    if (!foodName || !quantity || !location) {
        message.innerText = 'Please enter food name, quantity and location first.';
        return;
    }

    message.innerText = '✨ Generating description...';

    const formData = new FormData();
    formData.append('food_name', foodName);
    formData.append('quantity', quantity);
    formData.append('location', location);

    try {
        const response = await fetch("{% url 'generate_ai_description' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken
            },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Something went wrong.');
        }

        descriptionField.value = data.description;
        message.innerText = '✅ Description generated successfully!';

    } catch (error) {
        message.innerText = '❌ ' + error.message;
    }
});
</script>

<script>
document.getElementById('suggest-category').addEventListener('click', async function () {

    const foodName = document.getElementById('id_food_name').value.trim();
    const categoryField = document.getElementById('id_category');
    const message = document.getElementById('category-message');

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    if (!foodName) {
        message.innerText = 'Please enter a food name first.';
        return;
    }

    message.innerText = '🤖 AI is suggesting a category...';

    const formData = new FormData();
    formData.append('food_name', foodName);

    try {
        const response = await fetch("{% url 'suggest_food_category' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken
            },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Something went wrong.');
        }

        categoryField.value = data.category;
        message.innerText = '✅ Category suggested successfully!';

    } catch (error) {
        message.innerText = '❌ ' + error.message;
    }
});
</script>
</body>
</html>
